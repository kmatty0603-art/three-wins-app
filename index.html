<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日できたこと">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<title>今日できたこと</title>
<style>
:root{--bg:#f5f1e8;--card:#fff;--text:#222;--muted:#777;--line:#e5dfd4;--accent:#2f6f57;--soft:#deebe5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding-bottom:95px}
.wrap{max-width:720px;margin:auto;padding:24px 18px}h1{margin:8px 0 4px;font-size:30px}.sub{color:var(--muted);font-size:14px}.top{display:flex;justify-content:space-between;align-items:start}.pill{background:var(--soft);color:var(--accent);padding:9px 12px;border-radius:999px;font-weight:700}
.date{color:var(--accent);font-weight:700;margin:20px 0 12px}.card,.entry,.review{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}textarea{width:100%;min-height:72px;border:0;outline:0;resize:none;background:transparent;font-size:17px}
button{border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px}.primary{width:100%;background:var(--accent);color:white}.secondary{background:#fff;border:1px solid var(--line);color:var(--accent)}
.status{text-align:center;color:var(--accent);min-height:22px;margin:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;color:var(--accent);font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.section{font-size:19px;font-weight:700;margin:26px 0 12px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow,.day{text-align:center}.dow{font-size:12px;color:var(--muted);padding:3px}.day{aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px}.done{background:var(--soft);color:var(--accent);font-weight:800}.blank{background:transparent;border-color:transparent}
.monthbar{display:flex;justify-content:space-between;align-items:center}.entry-date{font-size:13px;color:var(--accent);font-weight:800}.entry ol{margin:7px 0 0;padding-left:20px}.entry li{margin:5px 0}.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(680px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:20px;padding:7px}nav button{background:transparent;color:var(--muted)}nav .active{background:var(--soft);color:var(--accent)}
.view{display:none}.view.active{display:block}.small{font-size:12px;color:var(--muted)}
</style></head><body><div class="wrap">
<div class="top"><div><h1>今日できたこと</h1><div class="sub">反省は書かない。できたことを3つだけ。</div></div><div class="pill" id="streak">0日連続</div></div>

<section id="today" class="view active">
<div class="date" id="date"></div>
<div class="card"><label>1つ目</label><textarea id="w1" placeholder="例：面倒なメールを返した"></textarea></div>
<div class="card"><label>2つ目</label><textarea id="w2" placeholder="例：昼ごはんをちゃんと食べた"></textarea></div>
<div class="card"><label>3つ目</label><textarea id="w3" placeholder="例：疲れていたけど5分だけ歩いた"></textarea></div>
<button class="primary" id="save">今日の3つを保存</button><div class="status" id="status"></div>
<div class="stats"><div class="stat"><b id="days">0</b><span>今月の記録日</span></div><div class="stat"><b id="wins">0</b><span>今月のできたこと</span></div><div class="stat"><b id="best">0</b><span>最長連続</span></div></div>
</section>

<section id="cal" class="view">
<div class="monthbar"><button class="secondary" id="prev">‹</button><b id="ctitle"></b><button class="secondary" id="next">›</button></div>
<div class="grid" id="grid" style="margin-top:12px"></div>
</section>

<section id="hist" class="view">
<div class="section" style="margin-top:0">これまでの記録</div><div id="history"></div>
<div class="section">今月の振り返り</div><div class="review" id="review"></div>
<div class="section">バックアップ</div><div class="row"><button class="secondary" id="export">書き出す</button><button class="secondary" id="import">読み込む</button></div>
<input id="file" type="file" accept="application/json" hidden><div class="small" style="margin-top:10px">記録はこのiPhone内に保存されます。定期的な書き出しがおすすめです。</div>
</section>
</div>
<nav><button class="active" data-id="today">今日</button><button data-id="cal">カレンダー</button><button data-id="hist">記録</button></nav>
<script>
const K="threeWinsRecordsV2",OLD="threeWinsRecordsV1",pad=n=>String(n).padStart(2,"0"),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date(),tk=key(now);let cm=new Date(now.getFullYear(),now.getMonth(),1);
function load(){try{let v=JSON.parse(localStorage.getItem(K)||"null");if(v)return v;let o=JSON.parse(localStorage.getItem(OLD)||"{}");if(Object.keys(o).length){localStorage.setItem(K,JSON.stringify(o));return o}}catch(e){}return{}}
function saveAll(x){localStorage.setItem(K,JSON.stringify(x))}
date.textContent=new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(now);
function loadToday(){let a=load()[tk]||["","",""];[w1,w2,w3].forEach((e,i)=>e.value=a[i]||"")}
function streaks(){let a=load(),ks=Object.keys(a).filter(k=>(a[k]||[]).filter(Boolean).length===3).sort(),set=new Set(ks),c=0,d=new Date(now);while(set.has(key(d))){c++;d.setDate(d.getDate()-1)}let b=0,r=0,p=null;for(let k of ks){let q=new Date(k+"T12:00:00");r=p&&Math.round((q-p)/86400000)===1?r+1:1;b=Math.max(b,r);p=q}return[c,b]}
function stats(){let a=load(),pre=`${now.getFullYear()}-${pad(now.getMonth()+1)}-`,ds=Object.keys(a).filter(k=>k.startsWith(pre)&&(a[k]||[]).filter(Boolean).length===3),s=streaks();days.textContent=ds.length;wins.textContent=ds.length*3;streak.textContent=s[0]+"日連続";best.textContent=s[1]}
save.onclick=()=>{let v=[w1.value.trim(),w2.value.trim(),w3.value.trim()];if(v.some(x=>!x)){status.textContent="3つ全部書いたら保存できます。";return}let a=load();a[tk]=v;saveAll(a);status.textContent="保存しました。今日はここまでで十分。";render()}
function calendar(){let a=load(),y=cm.getFullYear(),m=cm.getMonth();ctitle.textContent=`${y}年${m+1}月`;grid.innerHTML=["日","月","火","水","木","金","土"].map(x=>`<div class=dow>${x}</div>`).join("");let f=new Date(y,m,1),l=new Date(y,m+1,0);for(let i=0;i<f.getDay();i++)grid.innerHTML+="<div class='day blank'></div>";for(let d=1;d<=l.getDate();d++){let k=key(new Date(y,m,d)),ok=(a[k]||[]).filter(Boolean).length===3;grid.innerHTML+=`<div class='day ${ok?"done":""}'>${d}</div>`}}
prev.onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);calendar()};next.onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);calendar()}
function historyR(){let a=load(),e=Object.entries(a).sort((x,y)=>y[0].localeCompare(x[0]));history.innerHTML=e.length?e.map(([d,v])=>`<div class=entry><div class=entry-date>${new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"short",day:"numeric",weekday:"short"}).format(new Date(d+"T12:00:00"))}</div><ol>${v.filter(Boolean).map(x=>`<li>${x.replace(/[<>&]/g,"")}</li>`).join("")}</ol></div>`).join(""):"<div class=small>まだ記録はありません。</div>"}
function reviewR(){let a=load(),pre=`${now.getFullYear()}-${pad(now.getMonth()+1)}-`,e=Object.entries(a).filter(([k])=>k.startsWith(pre)),items=e.flatMap(x=>x[1].filter(Boolean));review.innerHTML=items.length?`今月は<b>${e.length}日</b>記録し、<b>${items.length}個</b>の「できたこと」を残しました。数字にしなくても、ちゃんと積み上がっています。`:"今月の記録がたまると、ここに振り返りが表示されます。"}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.id).classList.add("active");b.classList.add("active");render()})
export.onclick=()=>{let blob=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`three-wins-${tk}.json`;a.click()}
import.onclick=()=>file.click();file.onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{saveAll(JSON.parse(r.result));loadToday();render();alert("読み込みました")}catch(_){alert("読み込み失敗")}};r.readAsText(f)}
function render(){stats();calendar();historyR();reviewR()}loadToday();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
