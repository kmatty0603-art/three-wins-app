<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日できたこと">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>今日できたこと</title>
<style>
:root{--bg:#f5f1e8;--card:#fff;--text:#222;--muted:#777;--line:#e5dfd4;--accent:#2f6f57;--soft:#deebe5;--soft2:#eef5f1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:95px}
.wrap{max-width:720px;margin:auto;padding:24px 18px}
h1{margin:8px 0 4px;font-size:30px}.sub{color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{background:var(--soft);color:var(--accent);padding:9px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
.date{color:var(--accent);font-weight:700}
.editor-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 12px}
.card,.entry,.review{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
textarea{width:100%;min-height:72px;border:0;outline:0;resize:none;background:transparent;font-size:17px;line-height:1.45}
button{border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;-webkit-tap-highlight-color:transparent}
.primary{width:100%;background:var(--accent);color:white}
.secondary{background:#fff;border:1px solid var(--line);color:var(--accent)}
.status{text-align:center;color:var(--accent);min-height:22px;margin:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;color:var(--accent);font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.section{font-size:19px;font-weight:700;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow,.day{text-align:center}.dow{font-size:12px;color:var(--muted);padding:3px}
.day{aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;padding:0}
.day.done{background:var(--soft);color:var(--accent);font-weight:800}
.day.done:after{content:"✓";position:absolute;right:4px;bottom:1px;font-size:10px}
.day.future{opacity:.38}
.day.selected{outline:2px solid var(--accent)}
.blank{background:transparent;border-color:transparent}
.monthbar{display:flex;justify-content:space-between;align-items:center}
.entry-date{font-size:13px;color:var(--accent);font-weight:800}
.entry ol{margin:7px 0 0;padding-left:20px}.entry li{margin:5px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(680px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:7px;box-shadow:0 8px 24px rgba(0,0,0,.06);z-index:20}
nav button{background:transparent;color:var(--muted)}nav .active{background:var(--soft);color:var(--accent)}
.view{display:none}.view.active{display:block}.small{font-size:12px;color:var(--muted)}
.help{background:var(--soft2);border-radius:14px;padding:12px;color:var(--accent);font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>今日できたこと</h1>
      <div class="sub">反省は書かない。できたことを3つだけ。</div>
    </div>
    <div class="pill" id="streak">0日連続</div>
  </div>

  <section id="todayView" class="view active">
    <div class="editor-head">
      <div class="date" id="editDateLabel"></div>
      <button class="secondary" id="todayBtn">今日に戻る</button>
    </div>

    <div class="card"><label>1つ目</label><textarea id="w1" placeholder="例：面倒なメールを返した"></textarea></div>
    <div class="card"><label>2つ目</label><textarea id="w2" placeholder="例：昼ごはんをちゃんと食べた"></textarea></div>
    <div class="card"><label>3つ目</label><textarea id="w3" placeholder="例：疲れていたけど5分だけ歩いた"></textarea></div>

    <button class="primary" id="saveBtn">この日の3つを保存</button>
    <div class="status" id="status"></div>

    <div class="stats">
      <div class="stat"><b id="days">0</b><span>今月の記録日</span></div>
      <div class="stat"><b id="wins">0</b><span>今月のできたこと</span></div>
      <div class="stat"><b id="best">0</b><span>最長連続</span></div>
    </div>
  </section>

  <section id="calendarView" class="view">
    <div class="monthbar">
      <button class="secondary" id="prevBtn">‹</button>
      <b id="calendarTitle"></b>
      <button class="secondary" id="nextBtn">›</button>
    </div>
    <div class="grid" id="calendarGrid" style="margin-top:12px"></div>
    <div class="help">過去の日付をタップすると、その日の3つを後から記録・編集できます。</div>
  </section>

  <section id="historyView" class="view">
    <div class="section" style="margin-top:0">これまでの記録</div>
    <div id="history"></div>

    <div class="section">今月の振り返り</div>
    <div class="review" id="review"></div>

    <div class="section">バックアップ</div>
    <div class="row">
      <button class="secondary" id="exportBtn">書き出す</button>
      <button class="secondary" id="importBtn">読み込む</button>
    </div>
    <input id="importFile" type="file" accept="application/json" hidden>
    <div class="small" style="margin-top:10px">記録はこのiPhone内に保存されます。定期的な書き出しがおすすめです。</div>
  </section>
</div>

<nav>
  <button class="active" data-view="todayView">今日</button>
  <button data-view="calendarView">カレンダー</button>
  <button data-view="historyView">記録</button>
</nav>

<script>
(function(){
"use strict";

const KEY="threeWinsRecordsV2";
const OLD_KEY="threeWinsRecordsV1";
const $=id=>document.getElementById(id);

const el={
  streak:$("streak"), editDateLabel:$("editDateLabel"), todayBtn:$("todayBtn"),
  w1:$("w1"), w2:$("w2"), w3:$("w3"), saveBtn:$("saveBtn"), status:$("status"),
  days:$("days"), wins:$("wins"), best:$("best"),
  prevBtn:$("prevBtn"), nextBtn:$("nextBtn"), calendarTitle:$("calendarTitle"), calendarGrid:$("calendarGrid"),
  history:$("history"), review:$("review"), exportBtn:$("exportBtn"), importBtn:$("importBtn"), importFile:$("importFile")
};

const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date(); now.setHours(12,0,0,0);
const todayKey=key(now);
let selectedKey=todayKey;
let calMonth=new Date(now.getFullYear(),now.getMonth(),1);

function load(){
  try{
    const v2=JSON.parse(localStorage.getItem(KEY)||"null");
    if(v2) return v2;
    const old=JSON.parse(localStorage.getItem(OLD_KEY)||"{}");
    if(Object.keys(old).length){
      localStorage.setItem(KEY,JSON.stringify(old));
      return old;
    }
  }catch(e){}
  return {};
}
function saveData(data){localStorage.setItem(KEY,JSON.stringify(data))}
function fromKey(k){return new Date(k+"T12:00:00")}
function fmtDate(k){return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(fromKey(k))}
function isFuture(k){return fromKey(k)>now}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function loadSelected(){
  const vals=load()[selectedKey]||["","",""];
  [el.w1,el.w2,el.w3].forEach((node,i)=>node.value=vals[i]||"");
  el.editDateLabel.textContent=selectedKey===todayKey ? "今日・"+fmtDate(selectedKey) : fmtDate(selectedKey);
  el.todayBtn.style.display=selectedKey===todayKey ? "none" : "inline-block";
  el.status.textContent="";
}

function streaks(){
  const data=load();
  const keys=Object.keys(data).filter(k=>(data[k]||[]).filter(Boolean).length===3).sort();
  const set=new Set(keys);
  let current=0,d=new Date(now);
  while(set.has(key(d))){current++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  keys.forEach(k=>{
    const cur=fromKey(k);
    run=prev&&Math.round((cur-prev)/86400000)===1?run+1:1;
    best=Math.max(best,run);
    prev=cur;
  });
  return {current,best};
}

function renderStats(){
  const data=load();
  const prefix=`${now.getFullYear()}-${pad(now.getMonth()+1)}-`;
  const monthKeys=Object.keys(data).filter(k=>k.startsWith(prefix)&&(data[k]||[]).filter(Boolean).length===3);
  const s=streaks();
  el.days.textContent=monthKeys.length;
  el.wins.textContent=monthKeys.length*3;
  el.streak.textContent=s.current+"日連続";
  el.best.textContent=s.best;
}

function renderCalendar(){
  const data=load();
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  el.calendarTitle.textContent=`${y}年${m+1}月`;
  el.calendarGrid.innerHTML=["日","月","火","水","木","金","土"].map(x=>`<div class="dow">${x}</div>`).join("");
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  for(let i=0;i<first.getDay();i++) el.calendarGrid.insertAdjacentHTML("beforeend","<div class='day blank'></div>");
  for(let d=1;d<=last.getDate();d++){
    const k=key(new Date(y,m,d,12));
    const done=(data[k]||[]).filter(Boolean).length===3;
    const future=isFuture(k);
    const b=document.createElement("button");
    b.type="button";
    b.className=`day ${done?"done":""} ${future?"future":""} ${k===selectedKey?"selected":""}`;
    b.textContent=d;
    b.disabled=future;
    if(!future){
      b.addEventListener("click",()=>{
        selectedKey=k;
        loadSelected();
        switchView("todayView");
      });
    }
    el.calendarGrid.appendChild(b);
  }
}

function renderHistory(){
  const entries=Object.entries(load()).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!entries.length){el.history.innerHTML="<div class='small'>まだ記録はありません。</div>";return}
  el.history.innerHTML="";
  entries.forEach(([date,items])=>{
    const box=document.createElement("div");
    box.className="entry";
    box.innerHTML=`<div class="entry-date">${fmtDate(date)}</div><ol>${items.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
    box.addEventListener("click",()=>{selectedKey=date;loadSelected();switchView("todayView")});
    el.history.appendChild(box);
  });
}

function renderReview(){
  const data=load();
  const prefix=`${now.getFullYear()}-${pad(now.getMonth()+1)}-`;
  const entries=Object.entries(data).filter(([k])=>k.startsWith(prefix));
  const items=entries.flatMap(x=>(x[1]||[]).filter(Boolean));
  el.review.innerHTML=items.length
    ? `今月は<b>${entries.length}日</b>記録し、<b>${items.length}個</b>の「できたこと」を残しました。`
    : "今月の記録がたまると、ここに振り返りが表示されます。";
}

function renderAll(){renderStats();renderCalendar();renderHistory();renderReview()}

function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  const target=$(id);
  if(target) target.classList.add("active");
  const navBtn=document.querySelector(`nav button[data-view="${id}"]`);
  if(navBtn) navBtn.classList.add("active");
  if(id==="calendarView") renderCalendar();
  if(id==="historyView"){renderHistory();renderReview()}
  window.scrollTo({top:0,behavior:"instant"});
}

el.saveBtn.addEventListener("click",()=>{
  if(isFuture(selectedKey)){el.status.textContent="未来の日付には記録できません。";return}
  const vals=[el.w1.value.trim(),el.w2.value.trim(),el.w3.value.trim()];
  if(vals.some(v=>!v)){el.status.textContent="3つ全部書いたら保存できます。";return}
  const data=load();
  data[selectedKey]=vals;
  saveData(data);
  el.status.textContent=selectedKey===todayKey?"保存しました。今日はここまでで十分。":"この日の記録を保存しました。";
  renderAll();
});

el.todayBtn.addEventListener("click",()=>{
  selectedKey=todayKey;
  loadSelected();
  switchView("todayView");
});

el.prevBtn.addEventListener("click",()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);renderCalendar()});
el.nextBtn.addEventListener("click",()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);renderCalendar()});

document.querySelectorAll("nav button").forEach(btn=>{
  btn.addEventListener("click",()=>switchView(btn.dataset.view));
});

el.exportBtn.addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`three-wins-${todayKey}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
});

el.importBtn.addEventListener("click",()=>el.importFile.click());
el.importFile.addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      saveData(data);
      loadSelected();renderAll();
      alert("バックアップを読み込みました。");
    }catch(err){alert("読み込みに失敗しました。")}
  };
  r.readAsText(f);
});

loadSelected();
renderAll();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
})();
</script>
</body>
</html>
